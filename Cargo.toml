[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
podling-types = { path = "crates/podling-types" }
podling-core = { path = "crates/podling-core" }

serde = { version = "1.0", features = ["derive"] }
# Never enable serde_json's `preserve_order`: cache keys rely on its default
# sorted-key maps for canonical JSON.
serde_json = "1.0"
schemars = "1.2"
blake3 = "1.8"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
# Blocking HTTP for the OpenAI-compatible provider. Rustls only (no OpenSSL);
# no gzip, so a response cannot expand past the size cap while being read.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The NLI cross-encoder runs natively on the CPU with candle (pure Rust, no
# ONNX Runtime binaries downloaded at build time).
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# Only what loading a `tokenizer.json` needs: no progress bars, no training.
tokenizers = { version = "0.22", default-features = false }

# Audio (Phase 5): WAV read/write, and resampling the TTS model's native
# rate to the episode's 48 kHz. Both pure Rust, MIT OR Apache-2.0.
hound = "3.5"
rubato = "5"
# Safe wrappers for signals: the TTS sidecar gets SIGTERM first, so a wrapper
# such as `uv run` can pass it on. Already in the tree through tempfile.
rustix = { version = "1", features = ["process"] }

tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3"
insta = { version = "1.48", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_types = "deny"

# Dependencies are built optimised even in debug builds: candle's CPU kernels
# are 10-50x slower unoptimised, which makes the NLI stages unusable in
# `target/debug/podling`. Podling's own crates stay quick to compile.
[profile.dev.package."*"]
opt-level = 3
