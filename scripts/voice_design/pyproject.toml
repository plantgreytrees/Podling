# Offline voice design: makes a reference clip for `[[cast]]` from a written
# description with Qwen3-TTS VoiceDesign. Not a sidecar; the pipeline never
# runs it.
#
#   uv run python design.py --description "..." --text "..." --seed 7 --out voices/host.wav
#
# Licences of every direct dependency are listed in README.md.

[project]
name = "podling-voice-design"
version = "0.1.0"
description = "Design a Podling voice clip from a description, offline"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
  "qwen-tts==0.1.1",
  "torch>=2.8.0",
  "torchaudio>=2.8.0",
  "numpy>=2.1,<3",
  "soundfile>=0.12.1",
  "huggingface-hub>=0.24.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
