# The Tunguska episode, written by a local model instead of the offline fake.
# Any server that speaks the OpenAI chat-completions protocol works: Ollama
# (below), llama.cpp `llama-server`, vLLM, LM Studio, or OpenAI itself.
#
#   ollama pull llama3.1:8b
#   cargo run -p podling-cli -- run --episode examples/tunguska/episode-ollama.toml
#
# For a hosted provider, change `base_url` and `model`, and add
#   api_key_env = "OPENAI_API_KEY"
# naming the environment variable that holds your key. The key itself never
# goes in this file. Note that a hosted provider receives your source text.

title = "The Tunguska event"
topic = "the 1908 Tunguska explosion"
target_minutes = 5
sources = [
  { kind = "local_files", root = "sources/eyewitness", independence_group = "eyewitness" },
  { kind = "local_files", root = "sources/expedition", independence_group = "expedition" },
]
analysers = [{ kind = "quote_verifier" }]

[llm]
kind = "open_ai_compat"
base_url = "http://localhost:11434/v1"
# A placeholder: use any instruct model your server has.
model = "llama3.1:8b"
temperature = 0.2
# Writing the script takes a local 8B model 80 to 120 seconds on an 8 GB card,
# so the 120 second default can time out. A CPU-only server can manage as
# little as 1 to 2 tokens a second, so one reply can take ten minutes or more.
# A hosted model needs far less.
timeout_secs = 1800

# [embedding] and [nli] turn on the grounding stages: a claim its own passage
# doesn't entail is dropped (the run prints how many), claims worded
# differently by two sources are merged, and every claim is checked against
# the other sources' sentences, so a paraphrase corroborates it and a
# contradiction contests it. Set both, or neither.
#
#   ollama pull nomic-embed-text
#
# The embedding server receives claim and source sentence text.
[embedding]
kind = "open_ai_compat"
base_url = "http://localhost:11434/v1"
model = "nomic-embed-text"

# The NLI model runs locally on the CPU. Download it once (Apache-2.0):
#
#   hf download cross-encoder/nli-deberta-v3-base \
#     --local-dir examples/tunguska/models/nli-deberta-v3-base
[nli]
kind = "cross_encoder"
model_dir = "models/nli-deberta-v3-base"
