[package]
name = "podling-cli"
description = "The podling command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "podling"
path = "src/main.rs"

# A one-off acceptance check, not part of the shipped binary. `test = true`
# makes `cargo test` build the example and run its unit tests too.
[[example]]
name = "lexicon_ab"
test = true

[dependencies]
podling-types.workspace = true
podling-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
